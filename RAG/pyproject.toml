[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gyanesh Ranjan", email = "gyaneshrn94@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "chromadb>=0.3.23",
    "faiss-cpu>=1.16.0",
    "ipykernel>=7.4.0",
    "langchain>=1.4.10",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.7",
    "langchain-groq>=1.2.1",
    "langchain-text-splitters>=1.2.0",
    "pymupdf>=1.28.2",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
